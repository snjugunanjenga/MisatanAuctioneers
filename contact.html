<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mistan Auctioneers | Contact Us</title>
  <!-- Link Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Link Custom CSS -->
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <!-- Header -->
  <header class="bg-dark text-white py-3">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center">
        <h1 class="h3">Mistan Auctioneers</h1>
        <nav>
          <ul class="nav">
            <li class="nav-item"><a href="index.html" class="nav-link text-white">Home</a></li>
            <li class="nav-item"><a href="about.html" class="nav-link text-white">About Us</a></li>
            <li class="nav-item"><a href="services.html" class="nav-link text-white">Services</a></li>
            <li class="nav-item"><a href="auction-calendar.html" class="nav-link text-white">Auction Calendar</a></li>
            <li class="nav-item"><a href="blog.html" class="nav-link text-white">Blog</a></li>
            <li class="nav-item"><a href="contact.html" class="nav-link text-white active">Contact Us</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="py-5">
    <div class="container">
      <section class="contact">
        <h2 class="text-center mb-4">Contact Us</h2>
        <form id="contactForm" class="row g-3" onsubmit="return validateForm(event)">
          <div class="col-md-6">
            <label for="fullName" class="form-label">Full Name:</label>
            <input type="text" id="fullName" name="fullName" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label for="email" class="form-label">Email:</label>
            <input type="email" id="email" name="email" class="form-control" required />
          </div>
          <div class="col-12">
            <label for="subject" class="form-label">Subject:</label>
            <input type="text" id="subject" name="subject" class="form-control" required />
          </div>
          <div class="col-12">
            <label for="message" class="form-label">Message:</label>
            <textarea id="message" name="message" class="form-control" rows="5" required></textarea>
          </div>
          <div class="col-12 text-center">
            <button type="submit" class="btn btn-primary">Send Message</button>
          </div>
        </form>
        <div id="formFeedback" class="mt-3"></div>
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3">
    <p>&copy; 2025 Mistan Auctioneers. All Rights Reserved.</p>
    <p>Contact: info@mistanauctioneers.com</p>
  </footer>

  <!-- Link Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Link the Main JavaScript -->
  <script src="js/main.js"></script>
</body>
</html>
